[project]
name = "strawberry-orm"
version = "0.3.0"
description = "Unified, backend-agnostic ORM abstraction for Strawberry GraphQL"
readme = "README.md"
license = "MIT"
authors = [
    { name = "James Davidson", email = "jamie.t.davidson@gmail.com" },
    { name = "Patrick Arminio", email = "patrick.arminio@gmail.com" }
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "strawberry-graphql>=0.311.0",
]

[project.urls]
Homepage = "https://github.com/strawberry-graphql/strawberry-orm"
Repository = "https://github.com/strawberry-graphql/strawberry-orm"
Issues = "https://github.com/strawberry-graphql/strawberry-orm/issues"

[project.optional-dependencies]
django = ["django>=4.2"]
sqlalchemy = ["sqlalchemy>=2.0"]
tortoise = ["tortoise-orm>=0.25.0"]
dev = [
    "greenlet>=3.3.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-django>=4.8",
    "typer>=0.9",
    "uvicorn>=0.30",
]

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest-cov>=7.0.0",
    "starlette>=0.52.1",
    "typer>=0.24.1",
    "uvicorn>=0.41.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["strawberry_orm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "asyncio: mark test as async",
]
