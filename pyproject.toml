[project]
name = "strawberry-orm"
version = "0.1.0"
description = "Unified, backend-agnostic ORM abstraction for Strawberry GraphQL"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Patrick Arminio", email = "patrick.arminio@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "strawberry-graphql>=0.311.0",
]

[project.optional-dependencies]
django = ["django>=4.2"]
sqlalchemy = ["sqlalchemy>=2.0"]
tortoise = ["tortoise-orm>=0.25.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-django>=4.8",
    "typer>=0.9",
    "uvicorn>=0.30",
]

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "starlette>=0.52.1",
    "typer>=0.24.1",
    "uvicorn>=0.41.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["strawberry_orm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "asyncio: mark test as async",
]
